<html lang="hi">

    <style>

        }

        }

            color: #5a1a1a;
        }

            background: #b7e4c7;
            border-color: #1f8b4c;
            color: #0a3d1a;
        }
        .opt-btn.disabled {

        }

            padding: 15px 20px;

            border-left: 5px solid #1a6f9f;
            display: none;
        }

            font-size: 17px;
            font-weight: 600;
            margin-bottom: 5px;

            color: #0d6e2d;
        }

            color: #b02a37;
        }
        .feedback-box .hint-text {
            font-size: 15px;
            color: #2a4a6a;
            background: #e6edf5;
            padding: 8px 12px;
            border-radius: 6px;
            margin-top: 6px;

            padding-top: 20px;

        }
    </style>
</head>

    let currentIndex = 0;
    let score = 0;
    let answeredStatus = new Array(questions.length).fill(false);
    let selectedChoice = new Array(questions.length).fill(null); // Stores correct/wrong status

    const qText = document.getElementById('qText');
    const optionsContainer = document.getElementById('optionsContainer');
    const feedbackBox = document.getElementById('feedbackBox');
    const feedbackMsg = document.getElementById('feedbackMsg');
    const hintText = document.getElementById('hintText');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const restartBtn = document.getElementById('restartBtn');
    const progressFill = document.getElementById('progressFill');
    const qCounter = document.getElementById('qCounter');
    const scoreCount = document.getElementById('scoreCount');
    const totalAttempted = document.getElementById('totalAttempted');

    function renderQuestion(index) {
        const q = questions[index];
        qText.innerText = `${index + 1}. ${q.q}`;

        // Generate options
        const opts = q.shuffled_opts;
        const labels = ['A', 'B', 'C', 'D'];
        let html = '';
        for (let i = 0; i < opts.length; i++) {
            let btnClass = 'opt-btn';
            let disabled = '';
            let onClick = `selectOption(${index}, ${i})`;

            // If already answered, apply styles
            if (answeredStatus[index]) {
                disabled = 'disabled';
                onClick = ''; // disable click
                const isCorrect = (opts[i] === q.correct_answer);
                if (isCorrect) {
                    btnClass += ' correct';
                } else if (selectedChoice[index] === i && !isCorrect) {
                    btnClass += ' wrong';
                }
                // If this option is the correct answer, highlight it green (for wrong selections to show correct)
                if (opts[i] === q.correct_answer) {
                    btnClass += ' reveal-correct';
                }
            }

            html += `<button class="${btnClass}" onclick="${onClick}" ${disabled} data-index="${i}">
                <span class="label">${labels[i]}.</span> ${opts[i]}
            </button>`;
        }
        optionsContainer.innerHTML = html;

        // Update feedback
        if (answeredStatus[index]) {
            const qData = questions[index];
            const isCorrect = (selectedChoice[index] !== null && qData.shuffled_opts[selectedChoice[index]] === qData.correct_answer);
            feedbackBox.style.display = 'block';
            if (isCorrect) {
                feedbackMsg.className = 'msg correct-msg';
                feedbackMsg.innerText = '✅ सही उत्तर! बहुत अच्छे!';
            } else {
                feedbackMsg.className = 'msg wrong-msg';
                feedbackMsg.innerText = `❌ गलत! सही उत्तर: ${qData.correct_answer}`;
            }
            hintText.innerText = `💡 संकेत: ${qData.hint}`;
        } else {
            feedbackBox.style.display = 'none';
        }

        // Update progress
        const answeredCount = answeredStatus.filter(v => v === true).length;
        progressFill.style.width = `${(answeredCount / questions.length) * 100}%`;
        qCounter.innerText = `प्रश्न ${index + 1} / ${questions.length}`;
        scoreCount.innerText = score;
        totalAttempted.innerText = answeredCount;

        // Update nav buttons
        prevBtn.disabled = (index === 0);
        nextBtn.disabled = (index === questions.length - 1);

        if (answeredStatus[qIndex]) return; // already answered

        const q = questions[qIndex];
        const selectedText = q.shuffled_opts[optIndex];
        const isCorrect = (selectedText === q.correct_answer);

        // Mark as answered
        answeredStatus[qIndex] = true;
        selectedChoice[qIndex] = optIndex;

        if (isCorrect) {
            score += 1;
        }

        // Re-render the question to show correct/wrong states
        renderQuestion(qIndex);

        // If correct, auto move to next after a short delay?
        // Let the user manually click next.
    };

    function goToPrev() {
        if (currentIndex > 0) {
            currentIndex--;
            renderQuestion(currentIndex);
        }
    }

    function goToNext() {
        if (currentIndex < questions.length - 1) {
            currentIndex++;
            renderQuestion(currentIndex);
        }
    }

    function restartQuiz() {
        if (confirm('क्या आप सभी प्रगति रीसेट करना चाहते हैं?')) {
            currentIndex = 0;
            score = 0;
            answeredStatus = new Array(questions.length).fill(false);
            selectedChoice = new Array(questions.length).fill(null);
            renderQuestion(0);
        }
    }

    // Event Listeners
    prevBtn.addEventListener('click', goToPrev);
    nextBtn.addEventListener('click', goToNext);
    restartBtn.addEventListener('click', restartQuiz);

    // Keyboard support
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') goToNext();
        if (e.key === 'ArrowLeft') goToPrev();
    });

    // Initial render
    renderQuestion(0);
</script>
</body>
</html>
